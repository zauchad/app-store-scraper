# Streamlit runtime config (safe to commit - no secrets here).
[server]
headless = true

[browser]
gatherUsageStats = false

# Daylight Intel — indigo brand + emerald opportunity on paper white.
# Keep in sync with dashboard/theme.py (same tokens, validated contrast).
[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#F1F3F7"
textColor = "#14161C"
linkColor = "#4338CA"
borderColor = "#DDE1E9"
font = "sans-serif"
baseFontSize = 15
