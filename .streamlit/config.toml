# Streamlit runtime config (safe to commit - no secrets here).
[server]
headless = true

[browser]
gatherUsageStats = false

# Midnight Intel — indigo brand + emerald opportunity on slate-blue dark
[theme]
base = "dark"
primaryColor = "#818CF8"
backgroundColor = "#0F1219"
secondaryBackgroundColor = "#1C2233"
textColor = "#F0F2F7"
linkColor = "#A5B4FC"
borderColor = "#2E3650"
font = "sans-serif"
baseFontSize = 15
