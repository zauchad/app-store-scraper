# Streamlit runtime config (safe to commit - no secrets here).
[server]
headless = true

[browser]
gatherUsageStats = false

# Opportunity Teal — trust (teal) + action (amber accents). Tuned for SaaS engagement.
[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#0A1018"
secondaryBackgroundColor = "#141C2B"
textColor = "#F1F5F9"
linkColor = "#5EEAD4"
borderColor = "#243047"
font = "sans-serif"
baseFontSize = 15
