name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  billing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run billing tests
        run: pytest tests/ -v
